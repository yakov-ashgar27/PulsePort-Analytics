name: Live demo (GitHub Pages)

# Zero-cost hosting: CI seeds a throwaway PostgreSQL, runs the real API
# in-process to export JSON snapshots, builds the dashboard in demo mode and
# publishes it to the gh-pages branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulseport
          POSTGRES_PASSWORD: pulseport
          POSTGRES_DB: pulseport
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulseport" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      - name: Export API snapshots from the real pipeline
        working-directory: backend
        env:
          PULSEPORT_DATABASE_URL: postgresql+asyncpg://pulseport:pulseport@localhost:5432/pulseport
        run: python -m scripts.export_static ../frontend/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install, typecheck and parity-test the in-browser power calculator
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Build static demo
        working-directory: frontend
        env:
          VITE_DEMO: "true"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          force_orphan: true
          commit_message: "deploy: live demo from ${{ github.sha }}"
