name: pulseport

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulseport
      POSTGRES_PASSWORD: pulseport
      POSTGRES_DB: pulseport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseport -d pulseport"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      PULSEPORT_DATABASE_URL: postgresql+asyncpg://pulseport:pulseport@db:5432/pulseport
      PULSEPORT_SEED_ON_STARTUP: "true"
      PULSEPORT_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
